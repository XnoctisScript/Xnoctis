<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #030303;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    font-family: 'JetBrains Mono', monospace;
    color: #ffffff;
  }

  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* Floating Control UI */
  .ui-layer {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .anim-badge {
    font-size: 11px;
    color: #888888;
    background: rgba(15, 15, 15, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 8px 14px;
    border-radius: 8px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    user-select: none;
  }

  .skip-btn {
    background: rgba(20, 20, 20, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    user-select: none;
  }

  .skip-btn:hover {
    background: #ffffff;
    color: #000000;
    border-color: #ffffff;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    transform: translateY(-1px);
  }

  .skip-btn:active {
    transform: translateY(0);
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- Skip Control Layer -->
<div class="ui-layer">
  <div class="anim-badge" id="anim-name">1/4: 3D MATRIX WAVE GRID</div>
  <button class="skip-btn" id="skip-btn" onclick="nextAnimation()">
    <span>SKIP</span>
    <i class="fa-solid fa-forward"></i>
  </button>
</div>

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

let W, H;
let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000 };
let time = 0;

let currentAnimIndex = 0;
const animNames = [
  "1/4: 3D MATRIX WAVE GRID",
  "2/4: WARP STARFIELD",
  "3/4: CYBER WIREFRAME GRID",
  "4/4: DIGITAL MATRIX STREAM"
];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  initCurrentAnimation();
}
window.addEventListener('resize', resize);

window.addEventListener('mousemove', e => {
  mouse.targetX = e.clientX;
  mouse.targetY = e.clientY;
});

window.addEventListener('mouseleave', () => {
  mouse.targetX = -1000;
  mouse.targetY = -1000;
});

/* ==========================================
   ANIMATION 1: 3D MATRIX WAVE GRID
   ========================================== */
function drawMatrixWave() {
  const cx = W / 2;
  const cy = H / 2;
  const cols = 42;
  const rows = 30;
  const spacingX = W * 0.035;
  const spacingY = H * 0.03;

  const mx = (mouse.x - cx) / cx;
  const my = (mouse.y - cy) / cy;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const gridX = (c - cols / 2) * spacingX;
      const gridY = (r - rows / 2) * spacingY;
      const distFromCenter = Math.sqrt(gridX * gridX + gridY * gridY);

      const wave = Math.sin(distFromCenter * 0.008 - time * 1.8) * 18 +
                   Math.cos((gridX * 0.01) + time) * 8;

      const perspectiveScale = 1 + (gridY * 0.0005);
      const projX = cx + gridX * perspectiveScale + mx * 30;
      const projY = cy + (gridY + wave) * perspectiveScale + my * 30;

      const edgeAlpha = Math.max(0, 1 - (distFromCenter / (W * 0.55)));
      if (edgeAlpha <= 0) continue;

      const alpha = (0.05 + Math.sin(time + distFromCenter * 0.01) * 0.04) * edgeAlpha;
      if (alpha <= 0.005) continue;

      ctx.fillStyle = `rgba(255, 255, 255, ${alpha + 0.05})`;

      if ((c + r) % 3 === 0) {
        const s = 3 * perspectiveScale;
        ctx.fillRect(projX - s / 2, projY - 0.5, s, 1);
        ctx.fillRect(projX - 0.5, projY - s / 2, 1, s);
      } else {
        const size = Math.max(1, 2 * perspectiveScale);
        ctx.fillRect(projX - size / 2, projY - size / 2, size, size);
      }
    }
  }
}

/* ==========================================
   ANIMATION 2: WARP STARFIELD
   ========================================== */
let warpStars = [];
function initWarpStarfield() {
  warpStars = [];
  const count = 300;
  for (let i = 0; i < count; i++) {
    warpStars.push({
      x: (Math.random() - 0.5) * W * 2,
      y: (Math.random() - 0.5) * H * 2,
      z: Math.random() * W,
      pz: 0
    });
  }
}

function drawWarpStarfield() {
  const cx = W / 2 + (mouse.x > 0 ? (mouse.x - W / 2) * 0.2 : 0);
  const cy = H / 2 + (mouse.y > 0 ? (mouse.y - H / 2) * 0.2 : 0);
  const speed = 6 + (mouse.x > 0 ? (Math.abs(mouse.x - W / 2) / W) * 12 : 0);

  for (let i = 0; i < warpStars.length; i++) {
    const s = warpStars[i];
    s.pz = s.z;
    s.z -= speed;

    if (s.z <= 0) {
      s.x = (Math.random() - 0.5) * W * 2;
      s.y = (Math.random() - 0.5) * H * 2;
      s.z = W;
      s.pz = s.z;
    }

    const k = 300 / s.z;
    const px = s.x * k + cx;
    const py = s.y * k + cy;

    const pk = 300 / s.pz;
    const ppx = s.x * pk + cx;
    const ppy = s.y * pk + cy;

    if (px >= 0 && px <= W && py >= 0 && py <= H) {
      const alpha = Math.min(1, (1 - s.z / W) * 1.5);
      ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.lineWidth = Math.max(0.5, (1 - s.z / W) * 2.5);
      ctx.beginPath();
      ctx.moveTo(ppx, ppy);
      ctx.lineTo(px, py);
      ctx.stroke();
    }
  }
}

/* ==========================================
   ANIMATION 3: CYBER WIREFRAME GRID
   ========================================== */
function drawCyberWireframeGrid() {
  const horizonY = H * 0.45;
  const lines = 24;
  const fov = 300;

  const mx = (mouse.x > 0 ? (mouse.x - W / 2) / (W / 2) : 0);
  const my = (mouse.y > 0 ? (mouse.y - H / 2) / (H / 2) : 0);

  for (let i = 1; i <= lines; i++) {
    const z = (i * 25 - (time * 40) % 25);
    const scale = fov / (fov + z * 3);
    const y = horizonY + (H - horizonY) * (1 - scale) + my * 20;

    const alpha = (1 - z / (lines * 25)) * 0.25;
    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  const vCols = 32;
  const vanishX = W / 2 + mx * 80;
  for (let c = 0; c <= vCols; c++) {
    const startX = (c / vCols) * W * 2 - W * 0.5;
    ctx.strokeStyle = `rgba(255, 255, 255, 0.08)`;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(vanishX, horizonY + my * 20);
    ctx.lineTo(startX, H);
    ctx.stroke();
  }
}

/* ==========================================
   ANIMATION 4: DIGITAL MATRIX STREAM
   ========================================== */
let matrixCols = [];
const MATRIX_CHARS = '01アイウエオカキクケコサシスセソXNOCTIS'.split('');

function initMatrixStream() {
  matrixCols = [];
  const colSize = 24;
  const cols = Math.floor(W / colSize);
  for (let i = 0; i < cols; i++) {
    matrixCols.push({
      x: i * colSize,
      y: Math.random() * -H,
      speed: Math.random() * 3 + 2,
      chars: Array.from({length: 20}, () => MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)])
    });
  }
}

function drawMatrixStream() {
  ctx.font = "13px 'JetBrains Mono', monospace";

  for (let i = 0; i < matrixCols.length; i++) {
    const col = matrixCols[i];
    col.y += col.speed;

    if (col.y > H + 300) {
      col.y = Math.random() * -200;
      col.speed = Math.random() * 3 + 2;
    }

    const dx = mouse.x - col.x;
    const isMouseNear = mouse.x > 0 && Math.abs(dx) < 120;

    for (let j = 0; j < col.chars.length; j++) {
      const cy = col.y - (j * 18);
      if (cy < -20 || cy > H) continue;

      if (Math.random() < 0.02) {
        col.chars[j] = MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)];
      }

      const dy = mouse.y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const isLead = j === 0;

      let alpha = isLead ? 0.8 : (1 - j / col.chars.length) * 0.25;
      if (isMouseNear && dist < 140) {
        alpha = Math.min(1, alpha + (1 - dist / 140) * 0.6);
        ctx.fillStyle = isLead ? `#ffffff` : `rgba(255, 255, 255, ${alpha})`;
      } else {
        ctx.fillStyle = `rgba(200, 200, 200, ${alpha})`;
      }

      ctx.fillText(col.chars[j], col.x, cy);
    }
  }
}

/* ==========================================
   INITIALIZER & CONTROLLER
   ========================================== */
function initCurrentAnimation() {
  if (currentAnimIndex === 1) initWarpStarfield();
  if (currentAnimIndex === 3) initMatrixStream();
}

function nextAnimation() {
  currentAnimIndex = (currentAnimIndex + 1) % animNames.length;
  document.getElementById('anim-name').textContent = animNames[currentAnimIndex];
  initCurrentAnimation();
}

resize();

function render() {
  time += 0.02;
  mouse.x += (mouse.targetX - mouse.x) * 0.1;
  mouse.y += (mouse.targetY - mouse.y) * 0.1;

  ctx.fillStyle = '#030303';
  ctx.fillRect(0, 0, W, H);

  switch(currentAnimIndex) {
    case 0: drawMatrixWave(); break;
    case 1: drawWarpStarfield(); break;
    case 2: drawCyberWireframeGrid(); break;
    case 3: drawMatrixStream(); break;
  }

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
